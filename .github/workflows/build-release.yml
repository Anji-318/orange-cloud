name: Build & Release (Web + Android)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.1.0)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release after build'
        required: false
        type: boolean
        default: true
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string
        default: ''

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        working-directory: apps/web
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          WRANGLER_SEND_METRICS: 'false'
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ env.VERSION }}
          path: apps/web/.next/
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
          include-hidden-files: true

  build-android:
    name: Build Android (OSS Only)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x apps/android/gradlew

      # versionCode 与「本地构建」保持一致：直接读 apps/android/app/build.gradle.kts
      # 里 versionCode 的默认值（当前 25），不按版本号推算，也不设独立输入项。
      # 历史上按版本号推算会得出 20105，远高于本地硬编码的 25，导致本地包被系统判为
      # 「版本更旧」而拒装。删掉 version_code 输入项后，CI 与本地同源，永远一致、
      # 可互相覆盖安装。
      # 发版时只需在 build.gradle.kts 改 versionName + versionCode，并在本表单填入版本号即可。
      - name: Resolve versionCode
        id: vc
        run: |
          VC=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=.*[^0-9]([0-9]+).*/\1/p' apps/android/app/build.gradle.kts | head -1)
          case "$VC" in
            ''|*[!0-9]*) VC="${{ github.run_number }}" ;;
          esac
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "Android versionCode = $VC (version=$VERSION)"

      - name: Generate local.properties
        working-directory: apps/android
        run: |
          echo "OAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID || vars.OAUTH_CLIENT_ID }}" > local.properties
          echo "OAUTH_REDIRECT_URI=${{ vars.OAUTH_REDIRECT_URI || 'https://oss.omail.us.kg/oauth/callback' }}" >> local.properties

      - name: Prepare release keystore
        run: |
          # 优先使用 Secrets 里的固定签名密钥（保证各版本签名一致、可覆盖安装）；
          # 未配置时回退为临时密钥（仅适合一次性构建，跨版本无法覆盖安装）。
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            # -i 忽略换行等杂散字符，容忍粘贴时带入的 CRLF
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -di > ${{ github.workspace }}/apps/android/ci-release.keystore
            echo "KS_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> "$GITHUB_ENV"
            echo "KS_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            # 解码后立即校验：文件无效或密码/别名不对时在此直接报明确错误
            if ! keytool -list -keystore ${{ github.workspace }}/apps/android/ci-release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null 2>&1; then
              echo "::error::KEYSTORE_BASE64 解码后不是有效密钥库，或 KEYSTORE_PASSWORD 不匹配。请用脚本选项7从 .jks 重新生成 b64，并核对三个 Secret 属于同一套密钥。"
              exit 1
            fi
            if ! keytool -list -keystore ${{ github.workspace }}/apps/android/ci-release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEYSTORE_ALIAS }}" > /dev/null 2>&1; then
              echo "::error::密钥库里没有别名 '${{ secrets.KEYSTORE_ALIAS }}'。别名必须是生成密钥时的基础文件名（可用 keytool -list 查看）。"
              exit 1
            fi
            echo "Using fixed release keystore from secrets (verified OK)"
          else
            keytool -genkey -v \
              -keystore ${{ github.workspace }}/apps/android/ci-release.keystore \
              -alias ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass password \
              -keypass password \
              -dname "CN=Orange Cloud, OU=CI, O=Open Source, L=Unknown, ST=Unknown, C=US"
            echo "KS_ALIAS=ci" >> "$GITHUB_ENV"
            echo "KS_PASSWORD=password" >> "$GITHUB_ENV"
            echo "WARNING: using ephemeral keystore - upgrades will NOT install over previous builds"
          fi

      - name: Build OSS release APK
        working-directory: apps/android
        run: |
          ./gradlew assembleOssRelease \
            -PversionName="${{ env.VERSION }}" \
            -PversionCode="${{ steps.vc.outputs.version_code }}" \
            -POAUTH_CLIENT_ID="${{ secrets.OAUTH_CLIENT_ID || vars.OAUTH_CLIENT_ID }}" \
            -POAUTH_REDIRECT_URI="${{ vars.OAUTH_REDIRECT_URI || 'https://oss.omail.us.kg/oauth/callback' }}" \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/apps/android/ci-release.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KS_PASSWORD" \
            --parallel \
            --build-cache \
            --configure-on-demand \
            -x lintVitalOssRelease \
            --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"

      # 构建成功但 APK 未签名时用户无法安装，这里提前拦住，避免发布出去才发现。
      # 注意：minSdk 26 的包默认只有 v2/v3 签名，keytool -printcert -jarfile 会误判，
      # 必须用 apksigner 校验。
      - name: Verify APK exists and is signed
        run: |
          APK="apps/android/app/build/outputs/apk/oss/release/orange-cloud.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::未找到 APK：$APK（构建产物路径与预期不符）"
            find apps/android/app/build/outputs -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::未找到 apksigner，跳过签名校验"
            exit 0
          fi
          if ! OUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1); then
            echo "$OUT"
            echo "::error::APK 未签名或签名无效，用户无法安装。请检查 KEYSTORE_* Secrets 与 injected signing 参数。"
            exit 1
          fi
          echo "$OUT" | head -n 8
          echo "APK 签名校验通过"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ env.VERSION }}
          path: |
            apps/android/app/build/outputs/apk/oss/release/orange-cloud.apk
            apps/android/app/build/outputs/mapping/ossRelease/mapping.txt
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-web, build-android]
    # Web 构建失败不阻塞 APK 发布：只要 Android 成功就发 Release
    if: ${{ always() && github.event.inputs.create_release == 'true' && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build-${{ env.VERSION }}
          path: artifacts/android/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION }}"
          REPO="${{ github.repository }}"

          # 上传时保留了相对路径（apk/oss/release/...），这里按文件名查找，不依赖层级
          APK=$(find artifacts/android -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::下载的产物里没有 APK"
            find artifacts -type f | head -50 || true
            exit 1
          fi
          echo "Found APK: $APK"

          # 1. 彻底删除旧 release 和 tag
          echo "Deleting existing release and tag: $TAG"
          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" 2>/dev/null || true

          # 2. 等待 GitHub API 同步
          sleep 5

          # 3. 生成 release notes
          NOTES="${{ github.event.inputs.release_notes }}"
          {
            [ -n "$NOTES" ] && echo "$NOTES" && echo ""
            echo "## Build Artifacts"
            echo "- **Android**: OSS APK (all Pro features unlocked at zero cost)"
            echo ""
            echo "## Notes"
            echo "- iOS build requires Apple Developer certificate and is not included in CI."
            echo "- Android OSS flavor has all Pro features enabled at zero cost."
            echo "- Web app requires your own Cloudflare OAuth Client and callback relay."
          } > /tmp/release_notes.md

          # 4. 创建 release
          echo "Creating release: $TAG"
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Orange Cloud ${TAG}" \
            --notes-file /tmp/release_notes.md

          # 5. 上传带版本号的 OSS APK
          echo "Uploading OSS APK..."
          cp "$APK" "orange-cloud-${TAG}-oss.apk"
          gh release upload "$TAG" --repo "$REPO" --clobber \
            "orange-cloud-${TAG}-oss.apk"

          echo "Release $TAG created successfully."
